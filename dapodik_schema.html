<title>Dapodik 2027 — Skema Basis Data</title>
<style>
:root{
  --paper:#f6f7f9; --panel:#ffffff; --ink:#1a2131; --muted:#616b7d; --faint:#8a93a3;
  --line:#e4e8ee; --line2:#eef1f5; --accent:#3f51c5; --accent-soft:#eaecfb;
  --pk:#946200; --pk-bg:#f8efd8; --fk:#6b4fca; --fk-bg:#efeafb;
  --sys:#5c6673; --sys-bg:#eceef2; --usr:#0b7a5e; --usr-bg:#e2f2ec;
  --shadow:0 1px 2px rgba(20,28,45,.06),0 4px 16px rgba(20,28,45,.05);
  --mono:ui-monospace,"SF Mono",Menlo,"Cascadia Code","Roboto Mono",monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0f1218; --panel:#161b24; --ink:#e7eaf0; --muted:#98a1b2; --faint:#6b7484;
  --line:#242b38; --line2:#1c222d; --accent:#8394ff; --accent-soft:#1e2540;
  --pk:#e2b653; --pk-bg:#2b2410; --fk:#ad93ff; --fk-bg:#221c39;
  --sys:#8b95a5; --sys-bg:#20262f; --usr:#37b998; --usr-bg:#10261f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --paper:#0f1218; --panel:#161b24; --ink:#e7eaf0; --muted:#98a1b2; --faint:#6b7484;
  --line:#242b38; --line2:#1c222d; --accent:#8394ff; --accent-soft:#1e2540;
  --pk:#e2b653; --pk-bg:#2b2410; --fk:#ad93ff; --fk-bg:#221c39;
  --sys:#8b95a5; --sys-bg:#20262f; --usr:#37b998; --usr-bg:#10261f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
:root[data-theme="light"]{
  --paper:#f6f7f9; --panel:#ffffff; --ink:#1a2131; --muted:#616b7d; --faint:#8a93a3;
  --line:#e4e8ee; --line2:#eef1f5; --accent:#3f51c5; --accent-soft:#eaecfb;
  --pk:#946200; --pk-bg:#f8efd8; --fk:#6b4fca; --fk-bg:#efeafb;
  --sys:#5c6673; --sys-bg:#eceef2; --usr:#0b7a5e; --usr-bg:#e2f2ec;
  --shadow:0 1px 2px rgba(20,28,45,.06),0 4px 16px rgba(20,28,45,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--panel)}
.hbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;padding:20px 0 16px}
.hbar h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0}
.hbar .sub{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.chip{font-family:var(--mono);font-size:11.5px;background:var(--paper);border:1px solid var(--line);
  border-radius:7px;padding:5px 9px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);font-weight:650}
.layout{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:calc(100vh - 74px)}
aside{border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;
  height:calc(100vh - 74px);overflow:hidden;display:flex;flex-direction:column}
.search{padding:12px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
.search input,.search select{width:100%;font-family:var(--ui);font-size:13px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.search input:focus,.search select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search input{font-family:var(--mono);font-size:12.5px}
.count{font-size:11px;color:var(--faint);padding:0 2px}
.list{overflow-y:auto;flex:1;padding:6px}
.trow{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-family:var(--mono);font-size:12.5px;color:var(--ink);border:1px solid transparent}
.trow:hover{background:var(--paper)}
.trow.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.trow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.trow .hub{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;opacity:.85}
.trow .cc{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.trow .ref{background:var(--pk);color:#fff;font-size:9.5px;border-radius:20px;padding:1px 6px;
  font-family:var(--ui);font-weight:600}
main{overflow-y:auto;height:calc(100vh - 74px);padding:24px 26px 60px}
.empty{max-width:760px}
.empty h2{font-size:16px;margin:0 0 6px}
.empty p{color:var(--muted);margin:0 0 14px;max-width:64ch}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.note h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note ul{margin:6px 0 0;padding-left:18px}.note li{margin:4px 0;color:var(--ink)}
.note code,code.m{font-family:var(--mono);font-size:.92em;background:var(--paper);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.hubc{font-family:var(--mono);font-size:12px;padding:9px 11px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hubc:hover{border-color:var(--accent)}
.hubc .n{background:var(--pk-bg);color:var(--pk);font-family:var(--ui);font-weight:650;font-size:11px;border-radius:20px;padding:1px 7px}
/* detail */
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:4px}
.dhead h2{font-family:var(--mono);font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em;word-break:break-all}
.tag{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:600}
.tag.schema{background:var(--sys-bg);color:var(--sys)}
.tag.pk{background:var(--pk-bg);color:var(--pk);font-family:var(--mono);font-weight:500}
.dmeta{color:var(--muted);font-size:12.5px;margin:2px 0 18px;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);background:var(--panel)}
table.cols{border-collapse:collapse;width:100%;font-size:13px}
table.cols th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);
  font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
table.cols td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
table.cols tr:last-child td{border-bottom:none}
table.cols tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.cn{font-family:var(--mono);font-weight:550;color:var(--ink)}
.ct{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:middle}
.d-pk{background:var(--pk)}.d-fk{background:var(--fk)}.d-sys{background:var(--sys)}.d-user{background:var(--usr)}
.rb{font-size:10.5px;border-radius:5px;padding:1px 7px;font-weight:600;white-space:nowrap;font-family:var(--ui)}
.rb.pk{background:var(--pk-bg);color:var(--pk)}.rb.ref{background:var(--fk-bg);color:var(--fk)}
.rb.sys{background:var(--sys-bg);color:var(--sys)}.rb.user{background:var(--usr-bg);color:var(--usr)}
.nn{font-size:11px;color:var(--muted)}.nn.req{color:var(--pk);font-weight:600}
.lock{font-size:10px;color:var(--fk);margin-left:5px}
a.link{color:var(--accent);text-decoration:none;font-family:var(--mono);cursor:pointer}
a.link:hover{text-decoration:underline}
.rel{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media(max-width:820px){.rel{grid-template-columns:1fr}}
.relcard h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.rellist{display:flex;flex-direction:column;gap:5px}
.relitem{font-family:var(--mono);font-size:12px;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;line-height:1.45}
.relitem .arw{color:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0 4px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.disc{font-size:11.5px;color:var(--faint);border-top:1px dashed var(--line);margin-top:26px;padding-top:12px;max-width:78ch}
.mtoggle{display:none}
@media(max-width:720px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;max-height:44vh}
  main{height:auto}
}
</style>

<script>
const SCHEMA=JSON.parse(document.getElementById('data').textContent);
const NAMES=Object.keys(SCHEMA);
const S={ntab:271,ncol:3467,nfk:528,npk:269};
document.getElementById('chips').innerHTML=[
  ['tabel',S.ntab],['kolom',S.ncol],['primary key',S.npk],['foreign key',S.nfk]
].map(([k,v])=>`<span class="chip"><b>${v}</b> ${k}</span>`).join('');
const roleName={pk:'Primary key',ref:'Foreign key',sys:'Sistem / audit',user:'Diisi pengguna'};
function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

let cur=null,filter='',sortBy='name';
function refCount(n){return (SCHEMA[n].refby||[]).length}
function sortedNames(){
  let ns=NAMES.filter(n=>{
    if(!filter)return true;
    if(n.toLowerCase().includes(filter))return true;
    return SCHEMA[n].cols.some(c=>c.n.toLowerCase().includes(filter));
  });
  if(sortBy==='name')ns.sort();
  else if(sortBy==='cols')ns.sort((a,b)=>SCHEMA[b].cols.length-SCHEMA[a].cols.length||a.localeCompare(b));
  else ns.sort((a,b)=>refCount(b)-refCount(a)||a.localeCompare(b));
  return ns;
}
function renderList(){
  const ns=sortedNames();
  document.getElementById('lcount').textContent=ns.length+' tabel'+(filter?' cocok':'');
  document.getElementById('list').innerHTML=ns.map(n=>{
    const t=SCHEMA[n],rc=refCount(n);
    return `<div class="trow${n===cur?' active':''}" data-n="${esc(n)}">
      ${rc>0?'<span class="hub" title="hub"></span>':'<span style="width:6px;flex:none"></span>'}
      <span class="nm">${esc(n)}</span>
      ${rc>0?`<span class="ref" title="dirujuk ${rc} FK">${rc}</span>`:''}
      <span class="cc">${t.cols.length}</span></div>`;
  }).join('');
}
function tlink(n){return `<a class="link" data-go="${esc(n)}">${esc(n)}</a>`}
function renderDetail(n){
  cur=n;const t=SCHEMA[n];
  const fkmap={};t.fks.forEach(f=>f.c.forEach(c=>fkmap[c]=f));
  const rows=t.cols.map(c=>{
    const req=c.nn?'<span class="nn req">NOT NULL</span>':'<span class="nn">null</span>';
    let type=esc(c.t);
    let name=`<span class="cn">${esc(c.n)}</span>`;
    if(c.r==='pk')name+=' <span class="lock" title="primary key">🔑</span>';
    if(c.lock)name+=' <span class="lock" title="field identitas — dikunci setelah validasi pusat">🔒</span>';
    let ref='';
    if(fkmap[c.n]){const f=fkmap[c.n];ref=`<div class="ct" style="margin-top:2px">→ ${tlink(f.rt)}<span style="color:var(--faint)">(${esc(f.rc.join(','))})</span></div>`}
    return `<tr>
      <td><span class="dot d-${c.r}"></span>${name}${ref}</td>
      <td class="ct">${type}</td>
      <td>${req}</td>
      <td class="ct">${c.d?esc(c.d):'<span style="color:var(--faint)">—</span>'}</td>
      <td><span class="rb ${c.r}">${roleName[c.r]}</span></td></tr>`;
  }).join('');
  const outfk=t.fks.length?t.fks.map(f=>`<div class="relitem"><span style="color:var(--fk)">${esc(f.c.join(','))}</span> <span class="arw">→</span> ${tlink(f.rt)} <span style="color:var(--faint)">(${esc(f.rc.join(','))})</span></div>`).join(''):'<div class="relitem" style="color:var(--faint)">tidak ada</div>';
  const rb=(t.refby||[]);
  const infk=rb.length?rb.map(r=>`<div class="relitem">${tlink(r.from)}<span style="color:var(--faint)">.${esc(r.cols.join(','))}</span> <span class="arw">→</span> <span style="color:var(--fk)">${esc(n)}</span></div>`).join(''):'<div class="relitem" style="color:var(--faint)">tidak ada</div>';
  document.getElementById('main').innerHTML=`
    <div class="dhead">
      <h2>${esc(n)}</h2>
      <span class="tag schema">schema: ${esc(t.schema)}</span>
      ${t.pk.length?`<span class="tag pk">PK: ${esc(t.pk.join(', '))}</span>`:'<span class="tag schema">tanpa PK</span>'}
    </div>
    <div class="dmeta">${t.cols.length} kolom · ${t.fks.length} FK keluar · ${rb.length} dirujuk</div>
    <div class="legend">
      <span><span class="dot d-pk"></span>Primary key</span>
      <span><span class="dot d-fk"></span>Foreign key</span>
      <span><span class="dot d-sys"></span>Sistem/audit</span>
      <span><span class="dot d-user"></span>Diisi pengguna</span>
    </div>
    <div class="tablewrap"><table class="cols"><thead><tr>
      <th>Kolom</th><th>Tipe</th><th>Null</th><th>Default</th><th>Peran (inferensi)</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="rel">
      <div class="relcard"><h3>Merujuk ke (FK keluar)</h3><div class="rellist">${outfk}</div></div>
      <div class="relcard"><h3>Dirujuk oleh (FK masuk)</h3><div class="rellist">${infk}</div></div>
    </div>
    <p class="disc">Kolom "Peran" adalah <b>inferensi</b> dari konvensi skema, bukan dibaca dari kode aplikasi (kode UI ter-enkripsi ionCube). <b>Sistem/audit</b> = <code class="m">create_date</code>, <code class="m">last_update</code>, <code class="m">last_sync</code>, <code class="m">soft_delete</code>, <code class="m">updater_id</code>, dan famili validasi — dikelola aplikasi, bukan diketik pengguna. 🔒 menandai field identitas yang biasanya dikunci Dapodik setelah validasi pusat.</p>`;
  renderList();
  history.replaceState(null,'','#'+encodeURIComponent(n));
  document.getElementById('main').scrollTop=0;
}
function renderHome(){
  cur=null;renderList();
  const hubs=[...NAMES].sort((a,b)=>refCount(b)-refCount(a)).slice(0,14);
  document.getElementById('main').innerHTML=`<div class="empty">
    <h2>271 tabel transaksional · schema <code class="m">public</code></h2>
    <p>Skema operasional Dapodik yang dipulihkan dari <code class="m">pendataan.sql</code> (dump pg_dump di dalam installer). Pilih tabel di kiri, atau mulai dari entitas inti di bawah. Kolom FK dapat diklik untuk menelusuri relasi.</p>
    <div class="note"><h3>Entitas inti (paling banyak dirujuk)</h3>
      <div class="hubgrid">${hubs.map(h=>`<div class="hubc" data-go="${esc(h)}"><span>${esc(h)}</span><span class="n">${refCount(h)}</span></div>`).join('')}</div></div>
    <div class="note"><h3>Yang tidak ada di paket ini</h3><ul>
      <li>Tabel referensi <code class="m">ref.*</code> (agama, wilayah, pekerjaan, dsb.) — <b>dirujuk</b> oleh 200+ FK tetapi definisinya ikut <i>prefill</i> yang diunduh dari server saat registrasi, bukan di installer.</li>
      <li>Aturan <b>editable/read-only per field</b> — ada di <code class="m">*TableInfo.php</code>/<code class="m">classmap-pendataan-conf.php</code> yang <b>ter-enkripsi ionCube</b>. Peran kolom di sini adalah inferensi.</li>
      <li>8 tabel konfigurasi lokal (<code class="m">info_sekolah</code>, <code class="m">pengaturan</code>, <code class="m">ws_token</code>…) ada di <code class="m">dapodik_app.sql</code>, terpisah dari skema ini.</li>
    </ul></div>
  </div>`;
}
document.getElementById('list').addEventListener('click',e=>{const r=e.target.closest('[data-n]');if(r)renderDetail(r.dataset.n)});
document.getElementById('main').addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){renderDetail(g.dataset.go)}});
document.getElementById('q').addEventListener('input',e=>{filter=e.target.value.trim().toLowerCase();renderList()});
document.getElementById('sort').addEventListener('change',e=>{sortBy=e.target.value;renderList()});
const init=decodeURIComponent(location.hash.slice(1));
renderList();
if(init&&SCHEMA[init])renderDetail(init);else renderHome();
</script>
